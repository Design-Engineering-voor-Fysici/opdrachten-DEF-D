name: Add hoofd-TA to fork

on:
  fork:

jobs:
  add-hoofd-ta:
    runs-on: ubuntu-latest

    steps:
      - name: Add hoofd-TA team to fork
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          FORK_OWNER: ${{ github.event.forkee.owner.login }}
          FORK_NAME: ${{ github.event.forkee.name }}
        run: |
          gh api \
            --method PUT \
            "/orgs/Design-Engineering-voor-Fysici/teams/hoofd-ta/repos/$FORK_OWNER/$FORK_NAME" \
            -f permission=push
